<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ผังการแข่งขัน — DPSCUP 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><style>:root{--navy:#062b67;--blue:#1769e0;--pale:#f5f9ff;--ink:#102b50;--muted:#7185a3;--line:#dce7f5}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:var(--ink);font-family:Prompt,sans-serif}.wrap{max-width:1160px;margin:auto;padding:0 20px 50px}.nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-family:'Chakra Petch';font-weight:700;text-decoration:none}.brand img{width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}.brand small{font:600 10px Prompt;color:var(--muted)}.back{color:var(--blue);font-size:12px;text-decoration:none}.hero{margin-top:20px;background:linear-gradient(120deg,#fff,#eaf4ff);border:1px solid var(--line);border-radius:24px;padding:26px}.eyebrow{font-size:12px;color:var(--muted)}h1{font:700 clamp(34px,6vw,58px)/1 'Chakra Petch';margin:10px 0;color:var(--navy)}.hero p{margin:0;color:#6880a1;font-size:13px}.switch{display:flex;gap:8px;margin-top:18px}.switch button{border:1px solid #cfdff2;background:#fff;color:#5d7596;border-radius:999px;padding:10px 16px;font:600 12px Prompt}.switch button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section-head h2{font:700 25px 'Chakra Petch';margin:0;color:var(--navy)}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.group{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.group h3{margin:0;padding:13px 15px;background:linear-gradient(135deg,#062b67,#1769e0);color:#fff;font:700 18px 'Chakra Petch'}.team{padding:11px 14px;border-bottom:1px solid #edf2f8;font-size:12px;line-height:1.45}.team:last-child{border-bottom:0}.seed{float:right;color:#9aabc0;font-size:10px}.note{font-size:10px;color:#8da0b9;margin-top:8px}.bracket-wrap{overflow-x:auto;padding-bottom:8px}.bracket{min-width:1020px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px;align-items:stretch}.round{display:flex;flex-direction:column;justify-content:space-around;gap:14px}.round h3{font:700 16px 'Chakra Petch';color:var(--navy);margin:0 0 2px}.match{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}.match .label{font-size:9px;color:#8ba0ba;margin-bottom:7px}.slot{border:1px dashed #cbdcf0;border-radius:8px;padding:8px;margin:5px 0;color:#7890ae;font-size:11px;background:#fbfdff}.senior-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.senior-match{background:#fff;border:1px solid #dfd1ff;border-radius:16px;padding:15px}.senior-match .head{display:flex;justify-content:space-between;color:#7b3fe4;font-size:10px;font-weight:700}.senior-match .teams{margin-top:10px;font-size:13px;line-height:1.9}.senior-match .score{font:700 20px 'Chakra Petch';color:var(--navy)}.senior-banner{background:linear-gradient(135deg,#5d28c9,#8d55ef);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.senior-banner h3{margin:0;font:700 22px 'Chakra Petch'}.senior-banner p{margin:5px 0 0;font-size:11px;opacity:.85}.footer{text-align:center;margin-top:35px;color:#91a3b8;font-size:10px}@media(max-width:760px){.groups{grid-template-columns:1fr 1fr}.senior-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.groups,.senior-grid{grid-template-columns:1fr}.switch button{flex:1}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><img src="dpspn-logo.png"><span>DPSCUP <small>2026</small></span></a><a class="back" href="index.html">← กลับหน้าหลัก</a></nav><section class="hero"><div class="eyebrow">DPSPN · FOOTBALL TOURNAMENT 2026</div><h1>ผังการแข่งขัน</h1><p>แยกโครงสร้างตามรุ่นการแข่งขันอย่างชัดเจน</p><div class="switch"><button class="active" data-div="minor">🔵 ม.ต้น</button><button data-div="senior">🟣 ม.ปลาย</button></div></section><section class="section"><div class="section-head"><h2 id="title">🏟️ รอบแบ่งกลุ่ม · ม.ต้น</h2><span id="sub">4 สาย A–D</span></div><div id="content"></div></section><div class="footer">DPSPN · DPSCUP ครั้งที่ 2 · 2026</div></div><script>const minor={A:['DARK RAVENS X VORTEX','พ่อลังสั่งลุย X เต่าเพื่อนรัก','อาหรับน้อยร้อยลีลา'],B:['ลูกชายคนโต X TWO','เสืออ้วน X YIYA KATONG','บุรฮันสั่งลุย X อีเราะฮ์ฮอ'],C:['HUFFAZ WORRIORS FC','VORTEX','TSP รุ่นที่ 4 ACADEMY 1','ชาคริต X น้องกา'],D:['บูเดาะบูล่ะห์','ลุงโชเล่ X ปูดอง','น้องใหม่ X Q-CHANGE','ทีมงาน X อาเซียน']};const senior=['ไม่ได้แชมป์ ไม่ขึ้นมัสยิด','วัยรุ่นสายฮา X ทีเด็ด','Dewan G.20','วัยรุ่นสายฮา X ซีเครท'];const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];const seniorIds=['fri-4','sat-0b','sat-3','sat-6','sat-9','sat-12'];let scores={};let current='minor';const content=document.getElementById('content');const title=document.getElementById('title');const sub=document.getElementById('sub');function gradeScore(id){const r=scores[id];if(!r)return 'ยังไม่แข่ง';if(r.mode==='manual')return (Number(r.scoreA)||0)+' – '+(Number(r.scoreB)||0);const g=Array.isArray(r.goals)?r.goals:[];return g.filter(x=>x.team==='a').length+' – '+g.filter(x=>x.team==='b').length;}function renderMinor(){title.textContent='🏟️ รอบแบ่งกลุ่ม · ม.ต้น';sub.textContent='4 สาย A–D';content.innerHTML='<div class="groups">'+Object.entries(minor).map(([g,teams])=>'<div class="group"><h3>สาย '+g+'</h3>'+teams.map((t,i)=>'<div class="team"><span class="seed">'+(i+1)+'</span>'+t+'</div>').join('')+'</div>').join('')+'</div><div class="section"><div class="section-head"><h2>🏆 เส้นทางรอบน็อกเอาต์</h2><span>อันดับ 1–2 ของแต่ละสาย</span></div><div class="bracket-wrap"><div class="bracket"><div class="round"><h3>รอบ 8 ทีม</h3>'+['QF1','QF2','QF3','QF4'].map((x,i)=>'<div class="match"><div class="label">'+x+'</div><div class="slot">'+(i%2?'อันดับ 1':'อันดับ 1')+' กลุ่ม '+['A','B','C','D'][i]+'</div><div class="slot">อันดับ 2 กลุ่ม '+['B','A','D','C'][i]+'</div></div>').join('')+'</div><div class="round"><h3>รอบรองชนะเลิศ</h3><div class="match"><div class="label">SF1</div><div class="slot">ผู้ชนะ QF1</div><div class="slot">ผู้ชนะ QF2</div></div><div class="match"><div class="label">SF2</div><div class="slot">ผู้ชนะ QF3</div><div class="slot">ผู้ชนะ QF4</div></div></div><div class="round"><h3>🏆 รอบชิง</h3><div class="match"><div class="label">FINAL</div><div class="slot">ผู้ชนะ SF1</div><div class="slot">ผู้ชนะ SF2</div></div><div class="match"><div class="label">ชิงอันดับ 3</div><div class="slot">ผู้แพ้ SF1</div><div class="slot">ผู้แพ้ SF2</div></div></div></div></div></div>';}function renderSenior(){title.textContent='🟣 ม.ปลาย · พบกันหมด';sub.textContent='4 ทีม · ทุกทีมพบกัน 1 ครั้ง';let html='<div class="senior-banner"><h3>🟣 รอบพบกันหมด · ม.ปลาย</h3><p>ไม่มีการแบ่งสาย ทุกทีมพบกันหมด 1 ครั้ง รวม 6 นัด</p></div><div class="senior-grid">';pairs.forEach((p,i)=>{const id=seniorIds[i],r=scores[id],sc=gradeScore(id);html+='<div class="senior-match"><div class="head"><span>นัดที่ '+(i+1)+'</span><span>ม.ปลาย</span></div><div class="teams"><div>'+senior[p[0]]+'</div><div>'+senior[p[1]]+'</div></div><div class="score">'+sc+'</div></div>';});html+='</div>';content.innerHTML=html;}function render(){current==='minor'?renderMinor():renderSenior();}document.querySelectorAll('[data-div]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-div]').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.div;render();});if(window.DPSCUP_FIREBASE_CONFIG){firebase.initializeApp(window.DPSCUP_FIREBASE_CONFIG);firebase.database().ref('dpscup-2-scores').on('value',s=>{scores=s.val()||{};render();});}render();</script></body></html>
