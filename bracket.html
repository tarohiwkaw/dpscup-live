</style></head><body><div class="wrap"><nav class="top-nav"><a class="nav-brand" href="index.html"><img src="dpspn-logo.png"><span>DPSCUP <small>2026</small></span></a><a href="index.html" style="color:var(--blue);text-decoration:none;font-size:11px">← กลับ</a></nav><section class="hero"><div class="eyebrow">DPSPN · FOOTBALL TOURNAMENT 2026</div><h1 class="title">ผังการแข่งขัน</h1></section><div class="section-head"><h2>🔵 ม.ต้น · 4 สาย</h2><span>A–D</span></div><div class="groups" id="minor"></div><div class="section-head"><h2>🟣 ม.ปลาย · พบกันหมด</h2><span>6 นัด</span></div><div class="senior-grid" id="senior"></div><div class="footer">DPSPN · DPSCUP ครั้งที่ 2 · 2026</div></div><script>const A=window.DPSCUP_APP;const minor={A:['DARK RAVENS X VORTEX','พ่อลังสั่งลุย X เต่าเพื่อนรัก','อาหรับน้อยร้อยลีลา'],B:['ลูกชายคนโต X TWO','เสืออ้วน X YIYA KATONG','บุรฮันสั่งลุย X อีเราะฮ์ฮอ'],C:['HUFFAZ WORRIORS FC','VORTEX','TSP รุ่นที่ 4 ACADEMY 1','ชาคริต X น้องกา'],D:['บูเดาะบูล่ะห์','ลุงโชเล่ X ปูดอง','น้องใหม่ X Q-CHANGE','ทีมงาน X อาเซียน']};const senior=['ไม่ได้แชมป์ ไม่ขึ้นมัสยิด','วัยรุ่นสายฮา X ทีเด็ด','Dewan G.20','วัยรุ่นสายฮา X ซีเครท'];const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]],ids=['fri-4','sat-3','sat-9','sat-12','sat-6','sat-0b'];let scores={};function render(){document.getElementById('minor').innerHTML=Object.entries(minor).map(([g,ts])=>'<div class="group-box"><h3>สาย '+g+'</h3>'+ts.map((t,i)=>'<div>'+ (i+1)+' · '+A.esc(t)+'</div>').join('')+'</div>').join('');document.getElementById('senior').innerHTML=pairs.map((p,i)=>{const r=scores[ids[i]],sc=r?(r.mode==='manual'?(Number(r.scoreA)||0)+' – '+(Number(r.scoreB)||0):(r.goals||[]).filter(g=>g.team==='a').length+' – '+(r.goals||[]).filter(g=>g.team==='b').length):'ยังไม่แข่ง';return '<div class="senior-card"><div class="n">นัดที่ '+(i+1)+' · ม.ปลาย</div><div class="t">'+A.esc(senior[p[0]])+'<br>'+A.esc(senior[p[1]])+'</div><div class="s">'+sc+'</div></div>'}).join('')}if(!firebase.apps.length)firebase.initializeApp(window.DPSCUP_FIREBASE_CONFIG);firebase.database().ref(A.SCORE_KEY).on('value',s=>{scores=s.val()||{};render()});render();</script></body></html>
