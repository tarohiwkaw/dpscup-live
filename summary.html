<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPSCUP — สรุปผล</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script src="scorer-fix.js?v=53"></script><script src="analytics.js?v=51"></script><style>
/* v-beautify: summary page polish */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -20%;z-index:-1;background:radial-gradient(38% 45% at 15% 20%,rgba(255,255,255,.18),transparent 70%),radial-gradient(32% 40% at 85% 15%,rgba(255,255,255,.12),transparent 70%);animation:heroDrift 16s ease-in-out infinite alternate}

</style></head><body><div class="wrap"><nav class="top-nav"><a class="nav-brand" href="index.html"><img src="dpspn-logo.png"><span>DPSCUP <small>2026</small></span></a><div class="nav-links"><a href="index.html">ผลการแข่งขัน</a><a href="bracket.html">ผังการแข่งขัน</a></div></nav><section class="hero"><div class="eyebrow">DPSPN FOOTBALL TOURNAMENT 2026</div><h1 class="title">สรุปผลการแข่งขัน</h1><div class="hero-meta"><span class="pill">📅 11–13 กันยายน 2569</span><span class="pill">📍 สนามฟุตบอล King Power</span></div></section><div id="awards"></div><div class="section-head"><h2>👑 ดาวซัลโว</h2><span>ข้อมูลเดียวกับหน้าผลการแข่งขัน</span></div><details class="accordion" open><summary>⚽ TOP SCORERS</summary><div id="scorers"></div></details><div class="footer">DPSPN · DPSCUP ครั้งที่ 2 · 2026</div></div><script>const A=window.DPSCUP_APP;let matches=[],scores={};function awards(v){const fs=[['ม.ต้น','🥇','championMinor'],['ม.ต้น','🥈','runnerMinor'],['ม.ต้น','🥉','thirdMinor'],['ม.ต้น','⭐','bestPlayerMinor'],['ม.ต้น','🧤','bestGoalkeeperMinor'],['ม.ปลาย','🥇','championSenior'],['ม.ปลาย','🥈','runnerSenior'],['ม.ปลาย','🥉','thirdSenior'],['ม.ปลาย','⭐','bestPlayerSenior'],['ม.ปลาย','🧤','bestGoalkeeperSenior']];let h='';for(const g of ['ม.ต้น','ม.ปลาย']){h+='<div class="section-head"><h2>'+(g==='ม.ต้น'?'🔵':'🟣')+' '+g+'</h2></div><div class="summary-grid">';fs.filter(x=>x[0]===g).forEach(x=>h+='<div class="summary-item" style="background:#fff;border:1px solid var(--line);color:var(--ink)"><span>'+x[1]+'</span><b style="color:var(--navy)">'+A.esc(v[x[2]]||'ยังไม่ประกาศ')+'</b></div>');h+='</div>'}document.getElementById('awards').innerHTML=h}function render(){const rows=A.scorerRows(matches,scores),groups={'ม.ต้น':[],'ม.ปลาย':[]};rows.forEach(x=>groups[x.group]?.push(x));let h='';for(const [g,list] of Object.entries(groups)){h+='<div class="scorer-group">'+(g==='ม.ต้น'?'🔵':'🟣')+' '+g+'</div>';if(!list.length){h+='<div class="empty">ยังไม่มีข้อมูลผู้ทำประตูในรุ่นนี้</div>';continue}h+=list.slice(0,30).map((x,i)=>'<div class="scorer-row"><div class="scorer-rank">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</div><div><div class="scorer-name">'+A.esc(x.name)+'</div><div class="scorer-team">'+A.esc(x.team)+'</div></div><div class="scorer-goals">'+x.goals+'<small>ประตู</small></div></div>').join('')}document.getElementById('scorers').innerHTML=h}if(!firebase.apps.length)firebase.initializeApp(window.DPSCUP_FIREBASE_CONFIG);const db=firebase.database();db.ref(A.SCHEDULE_KEY).on('value',s=>{matches=A.normalizeSchedule(s.val());render()});db.ref(A.SCORE_KEY).on('value',s=>{scores=s.val()||{};render()});db.ref(A.SUMMARY_KEY).on('value',s=>awards(s.val()||{}));</script></body></html>
